events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 10m;

    # Use Docker DNS resolver so nginx can resolve service names at runtime
    resolver 127.0.0.11 valid=30s;
    # Remove static upstream to avoid DNS resolution at config time

    # CORS origin whitelist for the graph-service proxy
    map $http_origin $graph_cors_origin {
        default "";
        "~^http://localhost:(5173|18081|18084)$" $http_origin;
        "~^http://127.0.0.1:(5173|18081|18084)$" $http_origin;
    }

    server {
        listen 8080;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Проксируем API запросы к бэкенду
        location /api/ {
            # Resolve backend at runtime using a variable so Docker DNS is used
            set $backend_host kg-backend:8080;
            proxy_pass http://$backend_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /graph-service/ {
            # CORS preflight for graph-service (required by browser)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $graph_cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                return 204;
            }

            set $graph_service_host kg-graph-service:9091;
            rewrite ^/graph-service(/.*)$ $1 break;
            proxy_pass http://$graph_service_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Internal-Auth "";
            proxy_set_header X-User-Id "";

            # CORS headers on actual graph-service responses
            add_header 'Access-Control-Allow-Origin' $graph_cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
        
        # Swagger UI and OpenAPI spec
        location = /swagger {
            return 301 /swagger/;
        }
        location /swagger/ {
            rewrite ^/swagger/$ /swagger/index.html break;
            proxy_pass http://kg-backend:8080/swagger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.yaml {
            set $backend_host kg-backend:8080;
            proxy_pass http://$backend_host/openapi.yaml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }

    # Дополнительный сервер для проксирования запросов к фронтенду
    server {
        listen 8081;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Проксируем все корневые запросы к фронтенду (внутри сети порт 3000)
        location / {
            # Force runtime DNS resolution by using a variable in proxy_pass
            set $frontend_host kg-frontend:3000;
            proxy_pass http://$frontend_host/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Можно использовать health через nginx на 8081
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}

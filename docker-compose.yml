services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kg-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb_password}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb_user} -d ${POSTGRES_DB:-knowledge_base}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: kg-redis
    
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: kg-mongo
    
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nlp:
    build: ./nlp-service
    container_name: kg-nlp
    
    ports:
      - "5000:5000"
    environment:
      - MODEL_NAME=all-MiniLM-L6-V2
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HUB_OFFLINE=1
    volumes:
      - ./huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: server
    container_name: kg-backend
    
    ports:
      - "127.0.0.1:9000:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-kb_user}:${POSTGRES_PASSWORD:-kb_password}@postgres:5432/${POSTGRES_DB:-knowledge_base}?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_FLUSH_ON_STARTUP: "false"
      NLP_SERVICE_URL: ${NLP_SERVICE_URL:-http://nlp:5000}
      SKIP_AUTH: ${SKIP_AUTH:-false}  # Set to 'true' for testing without auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  graph-service:
    build:
      context: .
      dockerfile: ./services/graph-service/Dockerfile
    container_name: kg-graph-service
    
    ports:
      - "9090:9090"
      - "9091:9091"
    env_file:
      - .env
    environment:
      POSTGRES_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-kb_user}:${POSTGRES_PASSWORD:-kb_password}@postgres:5432/${POSTGRES_DB:-knowledge_base}?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      HTTP_PORT: 9091
      GRPC_PORT: 9090
      EVENT_CHANNEL: ${EVENT_CHANNEL:-graph:events}
      GRAPH_FULL_LIMIT: 1000
    volumes:
      - ./knowledge-graph.config.json:/app/knowledge-graph.config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  source-text-handler:
    build:
      context: ./source-text-handler
      dockerfile: ./Dockerfile
    container_name: kg-source-text-handler
    ports:
      - "8082:8081"
    environment:
      REDIS_URI: ${SOURCE_TEXT_HANDLER_REDIS_URI:-redis://redis:6379/0}
      BACKEND_URL: ${SOURCE_TEXT_HANDLER_BACKEND_URL:-http://backend:8080}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: worker
    container_name: kg-worker
    command: ["./worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-kb_user}:${POSTGRES_PASSWORD:-kb_password}@postgres:5432/${POSTGRES_DB:-knowledge_base}?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_FLUSH_ON_STARTUP: "false"
      NLP_SERVICE_URL: ${NLP_SERVICE_URL:-http://nlp:5000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        # В Docker сети backend доступен по имени сервиса
        VITE_API_TARGET: http://backend:8080/api
        VITE_GRAPH_SERVICE_URL: http://nginx:8080/graph-service
    container_name: kg-frontend
    
    ports:
      - "5173:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
          # For local Docker: use nginx proxy for API requests
          VITE_API_URL: ${VITE_API_URL:-http://nginx:8080}
          VITE_GRAPH_SERVICE_URL: ${VITE_GRAPH_SERVICE_URL:-http://nginx:8080/graph-service}
    healthcheck:
      # Проверяем, что фронтенд отрабатывает (доступен на внутр. порту 3000)
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      graph-service:
        condition: service_healthy
    restart: on-failure

  nginx:
    image: nginx:alpine
    container_name: kg-nginx
    
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: on-failure

volumes:
  postgres_data:
  mongodb_data:
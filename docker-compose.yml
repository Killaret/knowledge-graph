services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kg-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb_password}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb_user} -d ${POSTGRES_DB:-knowledge_base}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: kg-redis
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: kg-mongo
    
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nlp:
    build: ./nlp-service
    container_name: kg-nlp
    
    ports:
      - "5000:5000"
    environment:
      - NLP_MODEL_NAME=${NLP_MODEL_NAME:-paraphrase-multilingual-MiniLM-L12-v2}
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HUB_OFFLINE=1
    volumes:
      - ./huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 2G

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: server
    container_name: kg-backend
    
    ports:
      - "127.0.0.1:9000:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-kb_user}:${POSTGRES_PASSWORD:-kb_password}@postgres:5432/${POSTGRES_DB:-knowledge_base}?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_FLUSH_ON_STARTUP: "false"
      NLP_SERVICE_URL: ${NLP_SERVICE_URL:-http://nlp:5000}
      NLP_MODEL_NAME: ${NLP_MODEL_NAME:-paraphrase-multilingual-MiniLM-L12-v2}
      APP_ENV: development
      SKIP_AUTH: ${SKIP_AUTH:-false}  # ONLY allowed with APP_ENV=test
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:18080,http://localhost:18081,http://localhost:18082,http://localhost:18084,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:5173,http://127.0.0.1:18080,http://127.0.0.1:18081,http://127.0.0.1:18082,http://127.0.0.1:18084}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
      BACKUP_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  graph-service:
    build:
      context: .
      dockerfile: ./services/graph-service/Dockerfile
    container_name: kg-graph-service
    
    ports:
      - "9090:9090"
      - "9091:9091"
    env_file:
      - .env
    environment:
      POSTGRES_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-kb_user}:${POSTGRES_PASSWORD:-kb_password}@postgres:5432/${POSTGRES_DB:-knowledge_base}?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      HTTP_PORT: 9091
      GRPC_PORT: 9090
      EVENT_CHANNEL: ${EVENT_CHANNEL:-graph:events}
      GRAPH_FULL_LIMIT: 500
      NLP_MODEL_NAME: ${NLP_MODEL_NAME:-paraphrase-multilingual-MiniLM-L12-v2}
    volumes:
      - ./knowledge-graph.config.json:/app/knowledge-graph.config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: worker
    container_name: kg-worker
    command: ["./worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-kb_user}:${POSTGRES_PASSWORD:-kb_password}@postgres:5432/${POSTGRES_DB:-knowledge_base}?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_FLUSH_ON_STARTUP: "false"
      NLP_SERVICE_URL: ${NLP_SERVICE_URL:-http://nlp:5000}
      NLP_MODEL_NAME: ${NLP_MODEL_NAME:-paraphrase-multilingual-MiniLM-L12-v2}
      APP_ENV: development
      BACKUP_ENABLED: "false"
      BACKUP_CLOUD_ENABLED: "false"
      BACKUP_YANDEX_OAUTH_TOKEN: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_started
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        # Browser-accessible graph service URL (baked into client bundle)
        VITE_GRAPH_SERVICE_URL: http://localhost:18080/graph-service
    container_name: kg-frontend

    # Exposed only through nginx:18081 on the host; no direct host port
    # to avoid Windows reserved-port issues and CORS confusion.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
          # For browser: use nginx exposed on host port 18080 (NOT the Docker network hostname)
          VITE_API_URL: ${VITE_API_URL:-http://localhost:18080}
          VITE_GRAPH_SERVICE_URL: ${VITE_GRAPH_SERVICE_URL:-http://localhost:18080/graph-service}
          # For SSR hooks.server.ts: direct access to backend (no /api suffix)
          VITE_API_TARGET: ${VITE_API_TARGET:-http://backend:8080}
          # For SSR hooks.server.ts: direct access to graph service
          GRAPH_SERVICE_URL: ${GRAPH_SERVICE_URL:-http://graph-service:9091}
          # Internal authentication token for graph service (optional)
          GRAPH_SERVICE_INTERNAL_TOKEN: ${GRAPH_SERVICE_INTERNAL_TOKEN:-}
    healthcheck:
      # Проверяем, что фронтенд отрабатывает (доступен на внутр. порту 3000)
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      graph-service:
        condition: service_healthy
      nginx:
        condition: service_healthy
    restart: on-failure

  nginx:
    image: nginx:alpine
    container_name: kg-nginx
    
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
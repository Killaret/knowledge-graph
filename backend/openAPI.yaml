            message: "Invalid input data"
            details:
              - field: "title"
                reason: "required"
                message: "Title is required"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:

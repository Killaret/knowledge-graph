          description: Error reason code
          enum: [required, invalid_type, invalid_format, already_exists, too_long, out_of_range, invalid_value]
        message:
          type: string
          description: Human-readable error description
        received:
          type: string
          description: Received value (optional)
        expected:
          type: string
          description: Expected value/format (optional)


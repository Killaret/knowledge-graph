openapi: 3.1.0
info:
  title: Knowledge Graph API
  version: 1.1.0
  description: |
    Knowledge Graph API with unified REST responses.
    All responses follow the standard SuccessResponse and ErrorResponse formats.

    ## Authentication

    Authenticated endpoints accept either:
    - `Authorization: Bearer <JWT>` header, or
    - HttpOnly `access_token` cookie (sent automatically by the browser).

    ## Response format

    ### Success (200, 201):
    ```json
    {
      "data": { ... },
      "message": "Optional success message"
    }
    ```

    ### Error (400, 401, 403, 404, 409, 500):
    ```json
    {
      "code": "ERROR_CODE",
      "message": "Human-readable description",
      "details": [
        {
          "field": "field",
          "reason": "reason",
          "message": "description",
          "received": "received value",
          "expected": "expected value"
        }
      ]
    }
    ```

servers:
  - url: http://127.0.0.1:18080
    description: Dev nginx gateway (host port)
  - url: http://127.0.0.1:18083
    description: Test backend direct (SKIP_AUTH=false test stack)
  - url: http://127.0.0.1:9000
    description: Dev backend direct

paths:

version: "2"
run:
  tests: false
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Ignore "is unused" in test files
      - path: _test\.go
        text: "is unused"
        linters:
          - unused
    paths:
      - mocks
      - mock
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - mocks
      - mock
      - third_party$
      - builtin$
      - examples$

# Deploy variant: pulls pre-built images from Docker Hub instead of building.
# Use when you have the repository checked out (init-db, nginx.conf and
# knowledge-graph.config.json are still mounted from it) but do not want a
# full build. Update KG_IMAGE_TAG to move to a newer published release.
#
#   cp .env.example .env   # then set JWT_SECRET at minimum
#   docker compose -f docker-compose.deploy.yml up -d
#
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kg-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb_password}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb_user} -d ${POSTGRES_DB:-knowledge_base}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: kg-redis
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: kg-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nlp:
    image: killaret/knowledge-graph-nlp:${KG_IMAGE_TAG:-2026-09-08}
    container_name: kg-nlp
    ports:
      - "5000:5000"
    environment:
      - NLP_MODEL_NAME=${NLP_MODEL_NAME:-paraphrase-multilingual-MiniLM-L12-v2}
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_DISABLE_TELEMETRY=1
      # The embedding model is baked into the image; no host cache mount here
      # (an empty host directory would shadow it and break offline startup).
      - HF_HUB_OFFLINE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 2G

  backend:
    image: killaret/knowledge-graph-backend:${KG_IMAGE_TAG:-2026-09-08}
    container_name: kg-backend
    ports:
      - "127.0.0.1:9000:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-kb_user}:${POSTGRES_PASSWORD:-kb_password}@postgres:5432/${POSTGRES_DB:-knowledge_base}?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_FLUSH_ON_STARTUP: "false"
      NLP_SERVICE_URL: ${NLP_SERVICE_URL:-http://nlp:5000}
      NLP_MODEL_NAME: ${NLP_MODEL_NAME:-paraphrase-multilingual-MiniLM-L12-v2}
      APP_ENV: development
      SKIP_AUTH: ${SKIP_AUTH:-false}  # ONLY allowed with APP_ENV=test
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:18080,http://localhost:18081,http://localhost:18082,http://localhost:18084,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:5173,http://127.0.0.1:18080,http://127.0.0.1:18081,http://127.0.0.1:18082,http://127.0.0.1:18084}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
      BACKUP_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  graph-service:
    image: killaret/knowledge-graph-graph-service:${KG_IMAGE_TAG:-2026-09-08}
    container_name: kg-graph-service
    # No host ports: the service is reached through the nginx /graph-service
    # proxy and by backend/frontend over the compose network. 9090/9091 are
    # frequently reserved on Windows and would abort `up`.
    env_file:
      - .env
    environment:
      POSTGRES_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-kb_user}:${POSTGRES_PASSWORD:-kb_password}@postgres:5432/${POSTGRES_DB:-knowledge_base}?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      HTTP_PORT: 9091
      GRPC_PORT: 9090
      EVENT_CHANNEL: ${EVENT_CHANNEL:-graph:events}
      GRAPH_FULL_LIMIT: 500
      GRAPH_SERVICE_TRUST_USER_HEADER: "true"
      NLP_MODEL_NAME: ${NLP_MODEL_NAME:-paraphrase-multilingual-MiniLM-L12-v2}
    volumes:
      - ./knowledge-graph.config.json:/app/knowledge-graph.config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    image: killaret/knowledge-graph-worker:${KG_IMAGE_TAG:-2026-09-08}
    container_name: kg-worker
    command: ["./worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-kb_user}:${POSTGRES_PASSWORD:-kb_password}@postgres:5432/${POSTGRES_DB:-knowledge_base}?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_FLUSH_ON_STARTUP: "false"
      NLP_SERVICE_URL: ${NLP_SERVICE_URL:-http://nlp:5000}
      NLP_MODEL_NAME: ${NLP_MODEL_NAME:-paraphrase-multilingual-MiniLM-L12-v2}
      APP_ENV: development
      BACKUP_ENABLED: "false"
      BACKUP_CLOUD_ENABLED: "false"
      BACKUP_YANDEX_OAUTH_TOKEN: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_started
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    image: killaret/knowledge-graph-frontend:${KG_IMAGE_TAG:-2026-09-08}
    container_name: kg-frontend
    # Exposed only through nginx:18081 on the host; no direct host port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:18080}
      VITE_GRAPH_SERVICE_URL: ${VITE_GRAPH_SERVICE_URL:-http://localhost:18080/graph-service}
      VITE_API_TARGET: ${VITE_API_TARGET:-http://backend:8080}
      GRAPH_SERVICE_URL: ${GRAPH_SERVICE_URL:-http://graph-service:9091}
      GRAPH_SERVICE_INTERNAL_TOKEN: ${GRAPH_SERVICE_INTERNAL_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      graph-service:
        condition: service_healthy
      nginx:
        condition: service_healthy
    restart: on-failure

  nginx:
    image: nginx:alpine
    container_name: kg-nginx
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  mongodb_data:

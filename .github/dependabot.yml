version: 2
updates:
  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "knowledge-graph-maintainers"
    assignees:
      - "knowledge-graph-maintainers"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Backend dependencies (Go)
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "knowledge-graph-maintainers"
    assignees:
      - "knowledge-graph-maintainers"
    labels:
      - "dependencies"
      - "backend"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # NLP Service dependencies (Python)
  - package-ecosystem: "pip"
    directory: "/nlp-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "knowledge-graph-maintainers"
    assignees:
      - "knowledge-graph-maintainers"
    labels:
      - "dependencies"
      - "nlp"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "knowledge-graph-maintainers"
    assignees:
      - "knowledge-graph-maintainers"
    labels:
      - "dependencies"
      - "ci"
name: CI

on:
  pull_request:
    branches:
      - main
      - ai-agents
  push:
    branches-ignore:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============ CORE CHECKS (reusable) ============
  core-checks:
    name: Core Checks
    uses: ./.github/workflows/_core-checks.yml
    secrets: inherit

  # ============ CONFIG & MIGRATION VALIDATION ============
  config-validation:
    name: Config & Migration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Validate JSON syntax
        run: |
          cat ../knowledge-graph.config.json | jq . > /dev/null
          echo "✓ JSON syntax valid"

      - name: Check config loads successfully
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret' }}
        run: |
          go mod download
          go run cmd/checkconfig/main.go ../knowledge-graph.config.json

      - name: Verify required env vars documented
        run: |
          # Check only required environment variables (those without reasonable defaults)
          REQUIRED_VARS=(
            "DATABASE_URL"
            "JWT_SECRET"
          )
          MISSING=0
          for var in "${REQUIRED_VARS[@]}"; do
            if ! grep -qE "^#?$var=" ../.env.example 2>/dev/null; then
              echo "⚠️  Required variable $var not found in .env.example"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -eq 0 ]; then
            echo "✓ All required environment variables documented"
          else
            echo "⚠️  $MISSING required environment variables missing from .env.example"
            exit 1
          fi

  # ============ DOCKER COMPOSE VALIDATION ============
  docker-compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Create .env file from example
        run: |
          cp .env.example .env
          echo "✓ .env file created from .env.example"

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          echo "✓ docker-compose.yml valid"

      - name: Validate docker-compose.personal.yml syntax
        run: |
          docker compose -f docker-compose.personal.yml config > /dev/null
          echo "✓ docker-compose.personal.yml valid"

      - name: Validate docker-compose.test.yml syntax
        run: |
          docker compose -f docker-compose.test.yml config > /dev/null
          echo "✓ docker-compose.test.yml valid"

      - name: Check for conflicting env vars
        run: |
          ENV_VARS=$(grep -oP '\$\{[A-Z_]+' docker-compose*.yml | sed 's/\${//' | sort | uniq)
          MISSING=0
          for var in $ENV_VARS; do
            if ! grep -q "^$var=" .env.example 2>/dev/null; then
              echo "⚠️  $var used in docker-compose but not in .env.example"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -eq 0 ]; then
            echo "✓ All Docker Compose environment variables documented"
          fi

  # ============ SMOKE TESTS ============
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [core-checks]
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kb_user
          POSTGRES_PASSWORD: kb_password
          POSTGRES_DB: knowledge_base
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ./frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations
        env:
          DATABASE_URL: postgres://kb_user:kb_password@localhost:5432/knowledge_base?sslmode=disable
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/
          migrate -path ../backend/migrations -database "$DATABASE_URL" up

      - name: Start backend for smoke tests
        env:
          DATABASE_URL: postgres://kb_user:kb_password@localhost:5432/knowledge_base?sslmode=disable
          REDIS_URL: redis://localhost:6379
          MONGO_URL: mongodb://localhost:27017
          REDIS_FLUSH_ON_STARTUP: "true"
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret' }}
          GRAPH_SERVICE_INTERNAL_TOKEN: ${{ secrets.GRAPH_SERVICE_INTERNAL_TOKEN || 'ci-internal-token' }}
          GRAPH_SERVICE_URL: http://localhost:9091
          SKIP_AUTH: "true"
        run: |
          cd ../backend
          go mod download
          go run ./cmd/server &
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Backend is ready!"
              break
            fi
            echo "Waiting for backend... attempt $i/30"
            sleep 2
          done
          if ! curl -s http://localhost:8080/health > /dev/null 2>&1; then
            echo "❌ Backend failed to start"
            exit 1
          fi

      - name: Start graph-service for smoke tests
        env:
          POSTGRES_URL: postgres://kb_user:kb_password@localhost:5432/knowledge_base?sslmode=disable
          REDIS_URL: redis://localhost:6379
          HTTP_PORT: "9091"
          GRPC_PORT: "9090"
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret' }}
          GRAPH_SERVICE_INTERNAL_TOKEN: ${{ secrets.GRAPH_SERVICE_INTERNAL_TOKEN || 'ci-internal-token' }}
          SKIP_AUTH: "true"
        run: |
          cd ../services/graph-service
          go mod download
          go run ./cmd/server &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:9091/health > /dev/null 2>&1; then
              echo "✅ Graph-service is ready!"
              break
            fi
            echo "Waiting for graph-service... attempt $i/30"
            sleep 2
          done
          if ! curl -s http://127.0.0.1:9091/health > /dev/null 2>&1; then
            echo "❌ Graph-service failed to start"
            exit 1
          fi

      - name: Run smoke tests only
        env:
          PLAYWRIGHT_DEV_SERVER: true
          FRONTEND_URL: http://127.0.0.1:5173
          VITE_API_TARGET: http://127.0.0.1:8080
          VITE_GRAPH_SERVICE_URL: http://127.0.0.1:9091
          BACKEND_URL: http://localhost:8080
          GRAPH_SERVICE_URL: http://localhost:9091
        run: npx playwright test --grep="@smoke"

      - name: Run smoke BDD tests
        env:
          FRONTEND_URL: http://127.0.0.1:5173
          VITE_API_TARGET: http://127.0.0.1:8080
          VITE_GRAPH_SERVICE_URL: http://127.0.0.1:9091
          BACKEND_URL: http://localhost:8080
          GRAPH_SERVICE_URL: http://localhost:9091
        run: npm run test:cucumber -- --tags="@smoke"

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-test-results
          path: frontend/test-results/
          retention-days: 3

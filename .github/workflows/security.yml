name: Security Audit

on:
  pull_request:
    branches:
      - main
      - ai-agents
  push:
    branches-ignore:
      - main
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  frontend-security-audit:
    name: Frontend Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          if [ "$GITHUB_REF" == "refs/heads/main" ]; then
            npm audit --audit-level=high  # Strict for production
          else
            npm audit --audit-level=critical  # Less strict for dev
          fi

      - name: Check for unauthorized scripts
        run: |
          # Check for dangerous lifecycle scripts
          if jq -e '.scripts | keys | .[] | select(. == "postinstall" or . == "preinstall")' package.json > /dev/null; then
            echo "❌ Found dangerous lifecycle scripts (postinstall/preinstall)"
            echo "Please review NPM_SCRIPTS_WHITELIST.md for justification"
            exit 1
          fi
          echo "✅ No unauthorized lifecycle scripts found"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true  # Temporarily disabled until Dependency Graph is enabled
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
name: Core Checks (Reusable)

on:
  workflow_call:

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret-32-characters-long' }}

jobs:
  # ============ BACKEND LINT & UNIT TESTS ============
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-

      - name: Download dependencies
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ./backend
          version: v2.12.2
          args: --path-mode=abs --timeout=10m
          skip-cache: false
          install-mode: binary

      - name: Run backend tests
        run: go test -v -coverprofile=cover.out ./...

      - name: Check backend coverage threshold (min 70%)
        run: |
          python3 ../scripts/testing/backend-coverage-total.py cover.out 70

      - name: Validate config
        env:
          JWT_SECRET: ${{ env.JWT_SECRET }}
        run: go run cmd/checkconfig/main.go ../knowledge-graph.config.json

  # ============ BACKEND INTEGRATION TESTS ============
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-checks]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kb_user
          POSTGRES_PASSWORD: kb_password
          POSTGRES_DB: knowledge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    env:
      TEST_DATABASE_URL: postgres://kb_user:kb_password@localhost:5432/knowledge_test?sslmode=disable
      DATABASE_URL: postgres://kb_user:kb_password@localhost:5432/knowledge_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      MONGO_URL: mongodb://localhost:27017
      GRAPH_SERVICE_INTERNAL_TOKEN: ${{ secrets.GRAPH_SERVICE_INTERNAL_TOKEN }}
      GRAPH_SERVICE_URL: ""
      SKIP_AUTH: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-

      - name: Download dependencies
        run: go mod download

      - name: Run backend integration tests
        run: go test -tags=integration -p=1 -count=1 ./...

  # ============ GRAPH SERVICE CHECKS ============
  graph-service-checks:
    name: Graph Service Checks
    runs-on: ubuntu-latest
    needs: [backend-checks]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./services/graph-service
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: services/graph-service/go.sum

      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-graph-${{ hashFiles('services/graph-service/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gobuild-graph-

      - name: Download dependencies
        run: go mod download

      - name: Run graph-service unit tests
        env:
          JWT_SECRET: ${{ env.JWT_SECRET }}
          GRAPH_SERVICE_INTERNAL_TOKEN: ${{ secrets.GRAPH_SERVICE_INTERNAL_TOKEN || 'ci-internal-token' }}
        run: go test -v ./...

      - name: Run graph-service integration tests
        env:
          JWT_SECRET: ${{ env.JWT_SECRET }}
          GRAPH_SERVICE_INTERNAL_TOKEN: ${{ secrets.GRAPH_SERVICE_INTERNAL_TOKEN || 'ci-internal-token' }}
        run: go test -tags=integration -p=1 -count=1 ./...

  # ============ FRONTEND LINT & UNIT TESTS ============
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history required: check-decisions rule 3 and
          # check-commit-authorship inspect git log for task identifiers.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: ./frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Check for circular dependencies
        run: npm run check:circular

      - name: Clean ESLint cache
        run: rm -f .eslintcache

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check TypeScript
        run: npm run check

      - name: Verify generated config is in sync
        working-directory: .
        run: |
          npm run build-config
          git diff --exit-code knowledge-graph.config.json

      - name: Check documentation links
        working-directory: .
        run: node scripts/testing/check-docs-links.mjs .

      - name: Check decision index
        working-directory: .
        run: node scripts/testing/check-decisions.mjs .

      - name: Check task index
        working-directory: .
        run: node scripts/testing/check-tasks-index.mjs .

      - name: Check board size
        working-directory: .
        run: node scripts/testing/check-board-size.mjs .

      - name: Check board limits
        working-directory: .
        run: node scripts/testing/check-board-limits.mjs .

      - name: Run board limits guard tests
        working-directory: .
        run: node scripts/testing/check-board-limits.test.mjs

      - name: Run test stack ownership guard tests
        working-directory: .
        run: node scripts/testing/check-test-stack-ownership.test.mjs

      - name: Run docker skip reason tests
        working-directory: .
        run: node scripts/testing/check-all-docker-skip.test.mjs

      - name: Check commit authorship
        working-directory: .
        run: node scripts/testing/check-commit-authorship.mjs .

      - name: Check git hooks activation
        working-directory: .
        run: node scripts/testing/check-hooks-active.mjs .

      - name: Check dependency licenses
        working-directory: .
        run: node scripts/testing/check-licenses.mjs

      - name: Check .ps1 files are ASCII or have a BOM
        working-directory: .
        run: python scripts/testing/check-ps1-ascii.py

      - name: Check guard-personal-data.py
        working-directory: .
        run: python scripts/devops/test_guard_personal_data.py

      - name: Check worker backup mount
        working-directory: .
        run: python scripts/devops/check-worker-backup-mount.py

      - name: Run unit tests
        run: npm run test:unit

      - name: Check root BDD TypeScript
        run: npx tsc --noEmit -p ../tests/tsconfig.json

  # ============ NLP SERVICE TESTS ============
  nlp-checks:
    name: NLP Service Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./nlp-service
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch index avoids the multi-gigabyte nvidia wheels that
          # exceed the 10-minute job timeout on GitHub-hosted runners.
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Check requirements exist
        run: test -f requirements.txt || (echo "requirements.txt not found" && exit 1)

      - name: Run NLP tests
        run: pytest tests/ -v

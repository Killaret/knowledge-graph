name: Core Checks (Reusable)

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============ BACKEND LINT & UNIT TESTS ============
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: ./backend
          version: v2.12.2
          args: --path-mode=abs --timeout=10m
          skip-cache: false
          install-mode: binary

      - name: Run backend tests
        run: go test -v ./...

      - name: Validate config
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret' }}
        run: go run cmd/checkconfig/main.go ../knowledge-graph.config.json

  # ============ BACKEND INTEGRATION TESTS ============
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-checks]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run backend integration tests
        run: go test -tags=integration -p=1 -count=1 ./...
        timeout-minutes: 15

  # ============ FRONTEND LINT & UNIT TESTS ============
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Clean ESLint cache
        run: rm -f .eslintcache

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check TypeScript
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Check root BDD TypeScript
        run: npx tsc --noEmit -p ../tests/tsconfig.json

  # ============ NLP SERVICE TESTS ============
  nlp-checks:
    name: NLP Service Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nlp-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Check requirements exist
        run: test -f requirements.txt || (echo "requirements.txt not found" && exit 1)

      - name: Run NLP tests
        run: pytest tests/ -v

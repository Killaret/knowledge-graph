name: Cleanup Dry-Run Check

on:
  schedule:
    - cron: '0 3 * * 0' # weekly on Sunday at 03:00 UTC
  workflow_dispatch:

jobs:
  linux-dryrun:
    name: Linux dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh || true

      - name: Run bash dry-run
        run: |
          mkdir -p .github/artifacts
          ./scripts/clean_and_compress_lunix.sh --dry-run -c -p ./lunix.vhdx > .github/artifacts/clean_linux.log 2>&1 || true

      - name: Upload linux log
        uses: actions/upload-artifact@v4
        with:
          name: clean-linux-log
          path: .github/artifacts/clean_linux.log

      - name: Notify on failure (email)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '[Knowledge-Graph] Cleanup dry-run failed (Linux)'
          body: |
            The scheduled cleanup dry-run for Linux failed. See attached log.
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          secure: true

  windows-dryrun:
    name: Windows dry-run
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PowerShell dry-run
        shell: pwsh
        run: |
          New-Item -Path .github\artifacts -ItemType Directory -Force | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\clean_and_compress_lunix.ps1 -Search -Compress -DryRun *> .github\artifacts\clean_windows.log

      - name: Upload windows log
        uses: actions/upload-artifact@v4
        with:
          name: clean-windows-log
          path: .github/artifacts/clean_windows.log

      - name: Notify on failure (email)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '[Knowledge-Graph] Cleanup dry-run failed (Windows)'
          body: |
            The scheduled cleanup dry-run for Windows failed. See attached log.
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          secure: true

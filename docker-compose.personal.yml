services:
  postgres_personal:
    image: pgvector/pgvector:pg16
    container_name: kg-postgres-personal
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PERSONAL_POSTGRES_USER:-personal}
      POSTGRES_PASSWORD: ${PERSONAL_POSTGRES_PASSWORD:-personal_password}
      POSTGRES_DB: ${PERSONAL_POSTGRES_DB:-knowledge_personal}
    volumes:
      - pgdata_personal:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PERSONAL_POSTGRES_USER:-personal} -d ${PERSONAL_POSTGRES_DB:-knowledge_personal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis_personal:
    image: redis:7-alpine
    container_name: kg-redis-personal
    ports:
      - "6380:6379"
    volumes:
      - redisdata_personal:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo_personal:
    image: mongo:7
    container_name: kg-mongo-personal
    ports:
      - "27018:27017"
    volumes:
      - mongodbdata_personal:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nlp:
    build: ./nlp-service
    container_name: kg-nlp-personal
    ports:
      - "5001:5000"
    environment:
      - MODEL_NAME=all-MiniLM-L6-V2
      - HF_ENDPOINT=https://hf-mirror.com
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/torch/sentence_transformers
    volumes:
      - ./huggingface_cache:/root/.cache/torch/sentence_transformers
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: unless-stopped

  graph-service-personal:
    build:
      context: .
      dockerfile: ./services/graph-service/Dockerfile
    container_name: kg-graph-service-personal
    ports:
      - "9092:9091"
    env_file:
      - .env
    environment:
      POSTGRES_URL: ${PERSONAL_DATABASE_URL:-postgresql://${PERSONAL_POSTGRES_USER:-personal}:${PERSONAL_POSTGRES_PASSWORD:-personal_password}@postgres_personal:5432/${PERSONAL_POSTGRES_DB:-knowledge_personal}?sslmode=disable}
      REDIS_URL: ${PERSONAL_REDIS_URL:-redis_personal:6379}
      HTTP_PORT: 9091
      GRPC_PORT: 9090
      EVENT_CHANNEL: ${PERSONAL_EVENT_CHANNEL:-graph:events:personal}
    depends_on:
      postgres_personal:
        condition: service_healthy
      redis_personal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend_personal:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: server
    container_name: kg-backend-personal
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${PERSONAL_DATABASE_URL:-postgresql://${PERSONAL_POSTGRES_USER:-personal}:${PERSONAL_POSTGRES_PASSWORD:-personal_password}@postgres_personal:5432/${PERSONAL_POSTGRES_DB:-knowledge_personal}?sslmode=disable}
      REDIS_URL: ${PERSONAL_REDIS_URL:-redis_personal:6379}
      NLP_SERVICE_URL: ${NLP_SERVICE_URL:-http://nlp:5000}
    depends_on:
      postgres_personal:
        condition: service_healthy
      redis_personal:
        condition: service_healthy
      nlp:
        condition: service_started
      graph-service-personal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker_personal:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: worker
    container_name: kg-worker-personal
    command: ["./worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${PERSONAL_DATABASE_URL:-postgresql://${PERSONAL_POSTGRES_USER:-personal}:${PERSONAL_POSTGRES_PASSWORD:-personal_password}@postgres_personal:5432/${PERSONAL_POSTGRES_DB:-knowledge_personal}?sslmode=disable}
      REDIS_URL: ${PERSONAL_REDIS_URL:-redis_personal:6379}
      NLP_SERVICE_URL: ${NLP_SERVICE_URL:-http://nlp:5000}
    depends_on:
      postgres_personal:
        condition: service_healthy
      redis_personal:
        condition: service_healthy
      nlp:
        condition: service_started
      graph-service-personal:
        condition: service_healthy
    restart: unless-stopped

  nginx_personal:
    image: nginx:alpine
    container_name: kg-nginx-personal
    ports:
      - "8082:8080"
      - "8083:8081"
    volumes:
      - ./nginx.personal.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend_personal:
        condition: service_healthy
      graph-service-personal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend_personal:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_API_TARGET: http://backend_personal:8080
        VITE_GRAPH_SERVICE_URL: http://nginx_personal:8080/graph-service
    container_name: kg-frontend-personal
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      VITE_API_URL: ${PERSONAL_VITE_API_URL:-http://nginx_personal:8080}
      VITE_GRAPH_SERVICE_URL: ${PERSONAL_VITE_GRAPH_SERVICE_URL:-http://nginx_personal:8080/graph-service}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend_personal:
        condition: service_healthy
      graph-service-personal:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_personal:
  redisdata_personal:
  mongodbdata_personal:

  backup_scheduler:
    image: postgres:16-alpine
    container_name: kg-backup-scheduler
    volumes:
      - ./backups:/backups
      - ./scripts/utility:/scripts:ro
      - ./knowledge-graph.config.json:/config/config.json:ro
    environment:
      BACKUP_DIR: /backups
      BACKUP_CLOUD_ENABLED: ${BACKUP_CLOUD_ENABLED:-false}
      BACKUP_YANDEX_TOKEN: ${BACKUP_YANDEX_TOKEN:-}
      BACKUP_YANDEX_FOLDER: ${BACKUP_YANDEX_FOLDER:-/KnowledgeGraphBackups}
      PERSONAL_POSTGRES_HOST: postgres_personal
      PERSONAL_POSTGRES_PORT: 5432
      PERSONAL_POSTGRES_USER: ${PERSONAL_POSTGRES_USER:-personal}
      PERSONAL_POSTGRES_PASSWORD: ${PERSONAL_POSTGRES_PASSWORD:-personal_password}
      PERSONAL_POSTGRES_DB: ${PERSONAL_POSTGRES_DB:-knowledge_personal}
    command: >
      sh -c "
        apk add --no-cache curl gzip &&
        while true; do
          echo Running scheduled backup at $$(date) &&
          /scripts/backup-personal.sh &&
          echo Next backup in 24 hours &&
          sleep 86400
        done
      "
    depends_on:
      postgres_personal:
        condition: service_healthy
    restart: unless-stopped


version: '3.8'

# Local CI/CD Testing Environment
# Run: docker-compose -f docker-compose.test.yml up --abort-on-container-exit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge_graph_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  graph-service:
    build:
      context: .
      dockerfile: ./services/graph-service/Dockerfile
    container_name: kg-graph-service-test
    environment:
      POSTGRES_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/knowledge_base?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      HTTP_PORT: 9091
      GRPC_PORT: 9090
      EVENT_CHANNEL: ${EVENT_CHANNEL:-graph:events}
      GRAPH_FULL_LIMIT: 1000
    volumes:
      - ./knowledge-graph.config.json:/app/knowledge-graph.config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/knowledge_graph_test?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDIS_FLUSH_ON_STARTUP: "true"
      JWT_SECRET: test-secret-key-for-ci-cd-only
      SKIP_AUTH: "true"
      LOG_LEVEL: debug
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      graph-service:
        condition: service_healthy
    command: ["./server"]

  nginx:
    image: nginx:alpine
    container_name: kg-nginx-test
    ports:
      - "9093:8080"
      - "9094:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      graph-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: on-failure

  frontend-test:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_TARGET: http://backend:8080
        VITE_GRAPH_SERVICE_URL: http://nginx:8080/graph-service
    environment:
      BACKEND_URL: http://backend:8080
      FRONTEND_URL: http://localhost:5173
      SKIP_AUTH: "true"
      CI: "true"
      VITE_GRAPH_SERVICE_URL: http://nginx:8080/graph-service
    depends_on:
      backend:
        condition: service_started
      graph-service:
        condition: service_healthy
    volumes:
      - ./test-results:/app/test-results
      - ./frontend/tests:/app/tests
    command: >
      sh -c "
        echo '🧪 Running Frontend Tests...' &&
        npm run test:unit &&
        npx playwright test --grep='@smoke' --reporter=line &&
        echo '✅ Tests completed'
      "

  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/knowledge_graph_test?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SKIP_AUTH: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      graph-service:
        condition: service_healthy
    command: >
      sh -c "
        echo '🔧 Running Backend Tests...' &&
        go test ./internal/... -v 2>&1 | tail -50 &&
        echo '✅ Backend tests completed'
      "
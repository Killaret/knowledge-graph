services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: kg-test-postgres
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-kb_user}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-kb_password}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-knowledge_test}
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER:-kb_user} -d ${TEST_POSTGRES_DB:-knowledge_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis-test:
    image: redis:7-alpine
    container_name: kg-test-redis
    ports:
      - "16381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  mongo-test:
    image: mongo:7
    container_name: kg-test-mongo
    ports:
      - "27019:27017"
    volumes:
      - test_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  nlp-test:
    build: ./nlp-service
    container_name: kg-test-nlp
    ports:
      - "15002:5000"
    environment:
      - MODEL_NAME=all-MiniLM-L6-v2
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HUB_OFFLINE=0
    volumes:
      - ./huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 2G

  backend-test:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: server
    container_name: kg-test-backend
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      DATABASE_URL: postgresql://${TEST_POSTGRES_USER:-kb_user}:${TEST_POSTGRES_PASSWORD:-kb_password}@postgres-test:5432/${TEST_POSTGRES_DB:-knowledge_test}?sslmode=disable
      REDIS_URL: redis-test:6379
      REDIS_FLUSH_ON_STARTUP: "true"
      NLP_SERVICE_URL: http://nlp-test:5000
      SKIP_AUTH: ${SKIP_AUTH:-false}
      MONGO_URL: mongodb://mongo-test:27017
      MONGO_DATABASE: ${TEST_POSTGRES_DB:-knowledge_test}
      CORS_ALLOWED_ORIGINS: http://localhost:3002,http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://127.0.0.1:3002,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:5173,http://127.0.0.1:8080,http://127.0.0.1:8082
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mongo-test:
        condition: service_started
      nlp-test:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  graph-service-test:
    build:
      context: .
      dockerfile: ./services/graph-service/Dockerfile
    container_name: kg-test-graph-service
    ports:
      - "19090:9090"
      - "19091:9091"
    environment:
      POSTGRES_URL: postgresql://${TEST_POSTGRES_USER:-kb_user}:${TEST_POSTGRES_PASSWORD:-kb_password}@postgres-test:5432/${TEST_POSTGRES_DB:-knowledge_test}?sslmode=disable
      REDIS_URL: redis-test:6379
      HTTP_PORT: "9091"
      GRPC_PORT: "9090"
      EVENT_CHANNEL: graph:events
      GRAPH_FULL_LIMIT: "1000"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 1G

  frontend-test:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8083
        VITE_BACKEND_URL: http://localhost:8083
        VITE_GRAPH_SERVICE_URL: /graph-service/api
        VITE_SKIP_AUTH: "false"
    container_name: kg-test-frontend
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - VITE_API_URL=http://localhost:8083
      - VITE_SKIP_AUTH=false
      - GRAPH_SERVICE_URL=http://graph-service-test:9091
    depends_on:
      backend-test:
        condition: service_healthy
      graph-service-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  worker-test:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: worker
    container_name: kg-test-worker
    environment:
      DATABASE_URL: postgresql://${TEST_POSTGRES_USER:-kb_user}:${TEST_POSTGRES_PASSWORD:-kb_password}@postgres-test:5432/${TEST_POSTGRES_DB:-knowledge_test}?sslmode=disable
      REDIS_URL: redis-test:6379
      NLP_SERVICE_URL: http://nlp-test:5000
      SKIP_AUTH: ${SKIP_AUTH:-false}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:5173,http://127.0.0.1:8080,http://127.0.0.1:8082
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      nlp-test:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'worker' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  test_postgres_data:
  test_mongodb_data:

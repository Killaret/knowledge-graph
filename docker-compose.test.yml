services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: kg-test-postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: knowledge_test
    volumes:
      - pgdata_test:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d knowledge_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis-test:
    image: redis:7-alpine
    container_name: kg-test-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-test:
    image: mongo:7
    container_name: kg-test-mongo
    ports:
      - "27019:27017"
    volumes:
      - mongodbdata_test:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nlp-test:
    build: ./nlp-service
    container_name: kg-test-nlp
    ports:
      - "5002:5000"
    environment:
      - MODEL_NAME=all-MiniLM-L6-V2
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HUB_OFFLINE=1
    volumes:
      - ./huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: on-failure

  backend-test:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: server
    container_name: kg-test-backend
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      DATABASE_URL: postgresql://test_user:test_pass@postgres-test:5432/knowledge_test?sslmode=disable
      REDIS_URL: redis://redis-test:6379
      REDIS_FLUSH_ON_STARTUP: "true"
      NLP_SERVICE_URL: http://nlp-test:5000
      SKIP_AUTH: "true"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      nlp-test:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  graph-service-test:
    build:
      context: .
      dockerfile: ./services/graph-service/Dockerfile
    container_name: kg-test-graph-service
    ports:
      - "9094:9090"
      - "9095:9091"
    environment:
      POSTGRES_URL: postgresql://test_user:test_pass@postgres-test:5432/knowledge_test?sslmode=disable
      REDIS_URL: redis://redis-test:6379
      HTTP_PORT: 9091
      GRPC_PORT: 9090
      EVENT_CHANNEL: graph:events:test
      GRAPH_FULL_LIMIT: 1000
    volumes:
      - ./knowledge-graph.config.json:/app/knowledge-graph.config.json:ro
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  worker-test:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: worker
    container_name: kg-test-worker
    command: ["./worker"]
    environment:
      DATABASE_URL: postgresql://test_user:test_pass@postgres-test:5432/knowledge_test?sslmode=disable
      REDIS_URL: redis://redis-test:6379
      REDIS_FLUSH_ON_STARTUP: "true"
      NLP_SERVICE_URL: http://nlp-test:5000
      SKIP_AUTH: "true"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      nlp-test:
        condition: service_started
    restart: on-failure

  frontend-test:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_GRAPH_SERVICE_URL: http://localhost:8083/graph-service
    container_name: kg-test-frontend
    ports:
      - "3002:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VITE_API_URL: http://localhost:8083
      VITE_GRAPH_SERVICE_URL: http://localhost:8083/graph-service
      VITE_API_TARGET: http://backend-test:8080
      GRAPH_SERVICE_URL: http://graph-service-test:9091
      GRAPH_SERVICE_INTERNAL_TOKEN: ""
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend-test:
        condition: service_healthy
      graph-service-test:
        condition: service_healthy
    restart: on-failure

  nginx-test:
    image: nginx:alpine
    container_name: kg-test-nginx
    ports:
      - "8084:8080"
      - "8085:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: on-failure

volumes:
  pgdata_test:
  mongodbdata_test:

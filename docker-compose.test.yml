version: '3.8'

# Local CI/CD Testing Environment
# Run: docker-compose -f docker-compose.test.yml up --abort-on-container-exit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge_graph_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/knowledge_graph_test?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: test-secret-key-for-ci-cd-only
      SKIP_AUTH: "true"
      LOG_LEVEL: debug
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["./server"]

  frontend-test:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
      FRONTEND_URL: http://localhost:5173
      SKIP_AUTH: "true"
      CI: "true"
    depends_on:
      - backend
    volumes:
      - ./test-results:/app/test-results
      - ./frontend/tests:/app/tests
    command: >
      sh -c "
        echo '🧪 Running Frontend Tests...' &&
        npm run test:unit &&
        npx playwright test --grep='@smoke' --reporter=line &&
        echo '✅ Tests completed'
      "

  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/knowledge_graph_test?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SKIP_AUTH: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo '🔧 Running Backend Tests...' &&
        go test ./internal/... -v 2>&1 | tail -50 &&
        echo '✅ Backend tests completed'
      "
